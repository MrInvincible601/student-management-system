<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
    <a class="logo" href="{{ url_for('index') }}">🎓 <span>Student</span> Management</a>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('students') }}">Students</a>
        <a href="{{ url_for('add_student') }}">Add Student</a>
        <a href="{{ url_for('search') }}">Search</a>
    </div>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
{% endwith %}

<main class="form-container">
    <div class="form-card card">
        <span class="eyebrow">New Record</span>
        <h1>Add Student</h1>
        <p class="form-description">Enter the student's details below.</p>

        <form method="POST" action="{{ url_for('add_student') }}">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter student name" required>

            <label for="roll_no">Roll Number</label>
            <input type="text" id="roll_no" name="roll_no" placeholder="Enter roll number" required>

            <label for="course">Course</label>
            <input type="text" id="course" name="course" placeholder="e.g. B.Tech Computer Science" required>

            <label for="marks">Marks</label>
            <input type="number" id="marks" name="marks" placeholder="0–100" min="0" max="100" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="student@example.com" required>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

            <label for="department">Department</label>
            <input type="text" id="department" name="department" placeholder="Enter department" required>

            <label for="attendance">Attendance (%)</label>
            <input type="number" id="attendance" name="attendance" placeholder="0–100" min="0" max="100" required>

            <button type="submit">Add Student</button>
        </form>
        <a class="back-link" href="{{ url_for('students') }}">← Back to students</a>
    </div>
</main>
</body>
</html>
